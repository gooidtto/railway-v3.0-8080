<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 元素周期表 · 轻量视觉版</title><style>body{margin:0;background:#03070b;color:#eefaff;font-family:Inter,"Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}.page{max-width:1320px;margin:auto;padding:18px 10px}.hero{text-align:center}.hero h1{margin:0;font-size:clamp(30px,4vw,54px);background:linear-gradient(90deg,#38efff,#c5a4ff,#ff78db);-webkit-background-clip:text;color:transparent}.hero p{margin:7px 0 18px;color:#78aab5;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{height:290px;position:relative;overflow:hidden;border:1px solid var(--c);border-radius:10px;background:#050b11;box-shadow:0 0 0 1px #fff00008;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#fff}.title{position:absolute;left:14px;top:12px;font-weight:700;font-size:16px}.title i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}.sub{display:block;color:#91a1a8;font-size:10px;margin-top:4px}.visual{position:absolute;left:18px;right:18px;top:65px;bottom:42px;display:flex;align-items:center;justify-content:center}.table{display:grid;grid-template-columns:repeat(10,22px);gap:4px;transform:skewY(-8deg)}.node{width:22px;height:22px;border:1px solid var(--c);border-radius:4px;background:#09131a;color:#fff;display:grid;place-items:center;font-size:7px}.sphere{width:150px;height:110px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-content:center;transform:perspective(400px) rotateX(18deg)}.sphere .node:nth-child(odd){transform:translateY(5px)}.helix{position:relative;width:180px;height:130px}.helix .node{position:absolute}.grid3{display:grid;grid-template-columns:repeat(7,24px);gap:5px;transform:rotateX(45deg) rotateZ(-3deg)}.particle{display:flex;flex-wrap:wrap;width:220px;gap:9px;align-content:center;justify-content:center}.particle .dot{width:4px;height:4px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c)}.wave{width:230px;height:120px;position:relative}.wave span{position:absolute;left:0;right:0;height:42px;border-top:2px solid var(--c);border-radius:50%;transform:skewY(-7deg)}.wave span:nth-child(1){top:20px}.wave span:nth-child(2){top:47px;opacity:.65}.wave span:nth-child(3){top:74px;opacity:.35}.info{position:absolute;right:18px;bottom:46px;border:1px solid var(--c);padding:7px 10px;border-radius:7px;background:#071118;font-size:10px;text-align:center}.info b{display:block;font-size:21px}.caption{position:absolute;right:12px;bottom:11px;font-size:10px;color:#b5c3c8}.play{position:absolute;left:12px;bottom:8px;width:30px;height:30px;border:1px solid var(--c);border-radius:50%;display:grid;place-items:center}.controls{text-align:center;margin:14px 0;color:#8fdce6}.bottom{display:grid;grid-template-columns:1fr 1.8fr 1fr;gap:8px}.box{min-height:115px;border:1px solid #16404c;border-radius:9px;padding:13px;background:#040a0f}.box h3{margin:0 0 8px;color:#52efff;font-size:14px}.box ul{margin:0;padding-left:18px;line-height:1.7;font-size:11px}.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.mode{padding:10px 4px;background:#091117;border:1px solid #26363d;border-radius:6px;color:#dcecef}.mode:hover,.mode.active{border-color:#2ceeff;color:#5cefff}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.bottom{grid-template-columns:1fr}}@media(max-width:600px){.cards{grid-template-columns:1fr}.card{height:260px}.modes{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="page"><header class="hero"><h1>3D 元素周期表 · 多种动态效果</h1><p>Interactive 3D Periodic Table · Multiple Dynamic Styles</p></header><section class="cards" id="cards"></section><div class="controls">拖拽旋转 · 滚轮缩放 · 悬停查看 · 点击高亮 · 自动旋转</div><section class="bottom"><div class="box"><h3>实时数据</h3><ul><li>118 种元素</li><li>原子序、原子量</li><li>类别、周期、族</li><li>3D 动态渲染</li></ul></div><div class="box"><h3>模式选择</h3><div class="modes"><button class="mode active">表面</button><button class="mode">球体</button><button class="mode">螺旋</button><button class="mode">网格</button><button class="mode">粒子</button><button class="mode">波浪</button></div></div><div class="box"><h3>技术支持</h3><ul><li>轻量 CSS 视觉</li><li>GPU 合成</li><li>响应式设计</li><li>移动端支持</li></ul></div></section></main><script>const data=[['surface','表面模式','Surface Mode','Fe'],['sphere','球体模式','Sphere Mode','Au'],['helix','螺旋模式','Helix Mode','O'],['grid3','网格模式','Grid Mode','C'],['particle','粒子模式','Particle Mode','Ne'],['wave','波浪模式','Wave Mode','Si']];const colors=['#b86cff','#28ed6d','#ff59d4','#24ddff','#ffd21e','#8b8cff'];const els=['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Ge','As','Se','Br','Kr'];function visual(t,c){if(t==='table'||t==='surface')return '<div class="table">'+els.slice(0,30).map(x=>'<span class="node">'+x+'</span>').join('')+'</div>';if(t==='sphere')return '<div class="sphere">'+els.slice(0,24).map(x=>'<span class="node">'+x+'</span>').join('')+'</div>';if(t==='helix')return '<div class="helix">'+els.slice(0,20).map((x,i)=>'<span class="node" style="left:'+(75+Math.cos(i*.72)*70)+'px;top:'+(8+i*5.5)+'px">'+x+'</span>').join('')+'</div>';if(t==='grid3')return '<div class="grid3">'+els.slice(0,35).map(x=>'<span class="node">'+x+'</span>').join('')+'</div>';if(t==='particle')return '<div class="particle">'+Array.from({length:55},()=>'<i class="dot"></i>').join('')+'</div>';return '<div class="wave"><span></span><span></span><span></span></div>'}document.getElementById('cards').innerHTML=data.map((d,i)=>'<article class="card" style="--c:'+colors[i]+'"><div class="title"><i></i>'+d[1]+'<span class="sub">• '+d[2]+'</span></div><div class="visual">'+visual(d[0],colors[i])+'</div><div class="info"><b>'+d[3]+'</b>'+({Fe:'Iron · 55.845',Au:'Gold · 196.967',O:'Oxygen · 15.999',C:'Carbon · 12.011',Ne:'Neon · 20.180',Si:'Silicon · 28.085'}[d[3]])+'</div><div class="play">▷</div><div class="caption">低负载视觉 · 点击交互</div></article>').join('');document.querySelectorAll('.mode').forEach((b,i)=>b.onclick=()=>document.querySelectorAll('.mode').forEach((x,j)=>x.classList.toggle('active',i===j)));</script></body></html>
