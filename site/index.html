<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03070d"><title>3D 元素周期表</title><style>:root{--bg:#03070d;--panel:#07111a;--line:#1b3440;--text:#edf9fc;--muted:#8ba5ad;--cyan:#48eaff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}body{min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 35%,#0a1d2a 0,transparent 48%),#03070d}body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.28;pointer-events:none;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.3px),radial-gradient(circle,#58eaff 0 1px,transparent 1.4px);background-size:137px 151px,211px 193px;background-position:17px 23px,83px 61px}.page{width:min(1260px,100%);margin:auto;padding:18px 12px 30px}.hero{text-align:center;margin-bottom:14px}.hero h1{margin:0;font-size:clamp(28px,4vw,52px);font-weight:850;letter-spacing:.03em;background:linear-gradient(90deg,#54efff,#b7eaff 45%,#cf9aff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{position:relative;height:270px;border:1px solid var(--accent);border-radius:10px;background:linear-gradient(145deg,#091721,#04090f);overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff08;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-2px);border-color:#fff}.surface{--accent:#c77cff}.sphere{--accent:#37e875}.helix{--accent:#ff67d5}.grid{--accent:#38ddff}.particle{--accent:#ffd34d}.wave{--accent:#9298ff}.label{position:absolute;left:13px;top:11px;z-index:3}.label b{font-size:15px}.label small{display:block;color:#8da5ad;margin-top:3px;font-size:10px}.badge{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px}canvas{position:absolute;inset:38px 0 0;width:100%;height:215px;display:block}.hint{position:absolute;right:12px;bottom:10px;color:#80959d;font-size:9px}.bottom{margin-top:12px;display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}.box{border:1px solid var(--line);border-radius:9px;background:#061018;padding:13px;min-height:110px}.box h2{margin:0 0 8px;font-size:14px;color:var(--cyan)}.box p,.box li{font-size:11px;line-height:1.6;color:#c4d3d8}.box ul{margin:0;padding-left:16px}.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.mode{border:1px solid #29404a;background:#081018;color:#cfe0e5;border-radius:6px;min-height:58px;cursor:pointer}.mode strong{display:block;font-size:18px;margin-bottom:2px}.mode span{font-size:10px}.mode.active,.mode:hover{border-color:#4beaff;color:#74f4ff}.detail{margin-top:8px;border:1px solid var(--line);border-radius:9px;background:#061018;padding:13px;overflow:auto}.detail h2{margin:0 0 8px;font-size:14px;color:var(--cyan)}table{border-collapse:collapse;width:100%;min-width:720px;font-size:10px}th,td{border:1px solid #19323d;padding:6px 7px;text-align:left}th{color:#75e9f7}td{color:#cbd9dd}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.bottom{grid-template-columns:1fr}.modes{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.page{padding:12px 7px 22px}.cards{grid-template-columns:1fr}.card{height:250px}canvas{height:195px}.modes{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main class="page"><header class="hero"><h1>3D 元素周期表</h1><p>元素数据可视化 · 轻量扁平视觉 · 交互式探索</p></header><section class="cards"><article class="card surface"><div class="label"><b><i class="badge"></i>表面模式</b><small>周期表结构</small></div><canvas id="surface"></canvas><span class="hint">平面结构</span></article><article class="card sphere"><div class="label"><b><i class="badge"></i>球体模式</b><small>均匀分布</small></div><canvas id="sphere"></canvas><span class="hint">轻量透视</span></article><article class="card helix"><div class="label"><b><i class="badge"></i>螺旋模式</b><small>周期序列</small></div><canvas id="helix"></canvas><span class="hint">Z 轴压缩</span></article><article class="card grid"><div class="label"><b><i class="badge"></i>网格模式</b><small>三维矩阵</small></div><canvas id="grid"></canvas><span class="hint">低纵深</span></article><article class="card particle"><div class="label"><b><i class="badge"></i>粒子模式</b><small>元素节点</small></div><canvas id="particle"></canvas><span class="hint">静态粒子</span></article><article class="card wave"><div class="label"><b><i class="badge"></i>波浪模式</b><small>周期曲线</small></div><canvas id="wave"></canvas><span class="hint">无持续动画</span></article></section><section class="bottom"><div class="box"><h2>元素周期表</h2><ul><li>118 个已知元素</li><li>周期、族、原子序数</li><li>元素符号与名称</li><li>原子量与分类</li></ul></div><div class="box"><h2>交互模式</h2><div class="modes"><button class="mode active" data-mode="surface"><strong>▦</strong><span>表面</span></button><button class="mode" data-mode="sphere"><strong>◉</strong><span>球体</span></button><button class="mode" data-mode="helix"><strong>∿</strong><span>螺旋</span></button><button class="mode" data-mode="grid"><strong>⊞</strong><span>网格</span></button><button class="mode" data-mode="particle"><strong>·</strong><span>粒子</span></button><button class="mode" data-mode="wave"><strong>≈</strong><span>波浪</span></button></div></div><div class="box"><h2>视觉设计</h2><p>扁平卡片、轻透视、低纵深和静态星际背景。页面静止时不运行持续渲染循环。</p></div></section><section class="detail"><h2>元素信息</h2><table><thead><tr><th>原子序数</th><th>元素</th><th>符号</th><th>分类</th><th>周期</th><th>族</th><th>原子量</th></tr></thead><tbody id="elements"></tbody></table></section></main><script>const symbols='H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');const names='氢 氦 锂 铍 硼 碳 氮 氧 氟 氖 钠 镁 铝 硅 磷 硫 氯 氩 钾 钙 钪 钛 钒 铬 锰 铁 钴 镍 铜 锌 镓 锗 砷 硒 溴 氪 铷 锶 钇 锆 铌 钼 锝 钌 铑 钯 银 镉 铟 锡 锑 碲 碘 氙 铯 钡 镧 铈 镨 钕 钷 钐 铕 钆 铽 镝 钬 铒 铥 镱 镥 铪 钽 钨 铼 锇 铱 铂 金 汞 铊 铅 铋 钋 砹 氡 钫 镭 锕 钍 镤 铀 镎 钚 镅 锔 锫 锎 锿 镄 钔 锘 铹 鿏 𬬻 𬭊 𬭳 𬭛 𬭶 𬭴 𬭬 𫟼 鿏 𫓧 鿔 鿭 鿫 鿬'.split(' ');const colors=['#c77cff','#37e875','#ff67d5','#38ddff','#ffd34d','#9298ff'];function draw(id,mode,colorIndex){const c=document.getElementById(id),ctx=c.getContext('2d');const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);c.width=Math.max(1,Math.floor(r.width*d));c.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);const w=r.width,h=r.height,color=colors[colorIndex];ctx.clearRect(0,0,w,h);function tile(x,y,s){if(x<-20||x>w+20||y<-20||y>h+20)return;ctx.fillStyle='#09151d';ctx.strokeStyle=color+'a0';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,18,18,4);ctx.fill();ctx.stroke();ctx.fillStyle='#eafaff';ctx.font='700 7px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x+9,y+9)}if(mode==='surface')for(let i=0;i<118;i++)tile(w/2-170+(i%18)*20,h/2-55+Math.floor(i/18)*22,symbols[i]);if(mode==='sphere')for(let i=0;i<118;i++){const a=i*.52,rr=62*Math.sqrt(Math.max(0,1-Math.abs(i/59-1)));tile(w/2+Math.cos(a)*rr-9,h/2+Math.sin(a)*rr*.58-9,symbols[i])}if(mode==='helix')for(let i=0;i<118;i++){const t=i/117*Math.PI*5.5;tile(w/2+Math.cos(t)*72-9,h/2+(i-59)*1.55,symbols[i])}if(mode==='grid')for(let i=0;i<118;i++){const x=i%10,y=Math.floor(i/10)%6,z=Math.floor(i/60);tile(w/2+(x-4.5)*21-z*7-9,h/2+(y-2.5)*21-z*5-9,symbols[i])}if(mode==='particle')for(let i=0;i<118;i++){const a=i*2.399,r=18+(i*37)%90,x=w/2+Math.cos(a)*r,y=h/2+Math.sin(a)*r*.52;ctx.fillStyle=color;ctx.globalAlpha=.72;ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}if(mode==='wave')for(let i=0;i<118;i++){const x=18+i/117*(w-36),y=h/2+Math.sin(i*.28)*34;tile(x-9,y-9,symbols[i])}}['surface','sphere','helix','grid','particle','wave'].forEach((m,i)=>draw(m,m,i));window.addEventListener('resize',()=>['surface','sphere','helix','grid','particle','wave'].forEach((m,i)=>draw(m,m,i)));const tbody=document.getElementById('elements');symbols.forEach((s,i)=>{const z=i+1,period=z<=2?1:z<=10?2:z<=18?3:z<=36?4:z<=54?5:z<=86?6:7,tr=document.createElement('tr');tr.innerHTML=`<td>${z}</td><td>${names[i]||''}</td><td>${s}</td><td>元素</td><td>${period}</td><td>—</td><td>—</td>`;tbody.appendChild(tr)});document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('.'+b.dataset.mode).scrollIntoView({behavior:'smooth',block:'center'})});</script></body></html>
