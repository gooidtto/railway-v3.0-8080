<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00040a">
<title>3D 元素周期表 · 多种动态效果</title>
<style>
:root{--bg:#010307;--panel:#03070b;--line:#172831;--text:#f4fbff;--muted:#91a6af;--cyan:#42efff;--purple:#d18cff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}body{overflow-x:hidden;background:radial-gradient(circle at 50% -10%,#0b1c28 0,#02070b 38%,#000 78%)}button{font:inherit}.page{max-width:1440px;margin:auto;padding:22px 7px 32px}.hero{text-align:center;padding:0 10px 16px}.hero h1{margin:0;font-size:clamp(34px,4.35vw,66px);line-height:1.08;font-weight:850;letter-spacing:-.025em;background:linear-gradient(90deg,#35f5ff,#8eefff,#d18cff,#ff78de);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 34px #19dff033}.hero p{margin:11px 0 0;color:#83adb8;font-size:clamp(13px,1.45vw,19px);letter-spacing:.045em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card{--accent:#4cf2ff;position:relative;height:337px;border:1px solid #17262e;border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#03070b,#010204 72%);box-shadow:inset 0 0 28px #000,0 4px 22px #0008;cursor:pointer;isolation:isolate;transition:border-color .22s,box-shadow .22s}.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),var(--accent),transparent 36%);opacity:.05;pointer-events:none}.card:hover,.card.active{border-color:var(--accent);box-shadow:inset 0 0 28px #000,0 0 24px color-mix(in srgb,var(--accent) 18%,transparent)}.card:hover:before,.card.active:before{opacity:.12}.head{position:absolute;left:20px;top:17px;z-index:5}.head b{font-size:19px}.head small{display:block;margin-top:6px;color:#aab9bf}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 13px var(--accent);margin-right:8px}.viz{position:absolute;inset:58px 8px 39px;perspective:900px;display:grid;place-items:center}.scene{position:relative;width:94%;height:92%;transform-style:preserve-3d;transform:rotateX(var(--rx,12deg)) rotateY(var(--ry,-5deg));transition:transform .16s ease-out}.caption{position:absolute;right:18px;bottom:16px;color:#aab4b9;font-size:12px;z-index:5}.play{position:absolute;left:20px;bottom:14px;width:31px;height:31px;border:1px solid #2a4049;border-radius:50%;display:grid;place-items:center;color:#e8faff;background:#03080ccc;z-index:5}.card.active .play{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 35%,transparent)}.surface{--accent:#c978ff}.sphere{--accent:#2af16d}.helix{--accent:#ff62dc}.grid{--accent:#35eaff}.particle{--accent:#ffd21f}.wave{--accent:#8d95ff}
.tile{position:absolute;width:31px;height:25px;border:1px solid color-mix(in srgb,var(--accent) 70%,#1b2730);background:linear-gradient(145deg,#0b1720,#03070a);border-radius:4px;box-shadow:0 0 6px color-mix(in srgb,var(--accent) 22%,transparent);transform:translate(-50%,-50%);display:grid;place-items:center;font-size:7px;color:#dffaff}.tile:nth-child(3n){opacity:.65}.tile:nth-child(4n){transform:translate(-50%,-50%) translateZ(18px)}.surface .scene{transform:rotateX(var(--rx,16deg)) rotateY(var(--ry,-10deg)) skewX(-5deg)}.surface .focus,.focus{position:absolute;left:50%;top:42%;width:72px;height:70px;transform:translate(-50%,-50%) translateZ(48px);border:1px solid var(--accent);border-radius:8px;background:#050b10e8;box-shadow:0 0 20px color-mix(in srgb,var(--accent) 35%,transparent);text-align:center;display:grid;place-items:center;z-index:4}.focus strong{font-size:32px;color:#fff}.focus small{display:block;color:#a9c2ca;font-size:8px;margin-top:-17px}.sphere .scene{transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-8deg)}.orb{position:absolute;left:50%;top:50%;width:280px;height:190px;transform:translate(-50%,-50%) rotateX(58deg) rotateZ(12deg);border:1px solid #45f57a55;border-radius:50%;box-shadow:0 0 30px #35f17a15}.orb.two{transform:translate(-50%,-50%) rotateY(58deg) rotateZ(-22deg);border-color:#40eaff55}.ball{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 30% 25%,#fff78a 0,#5ff36d 30%,#13bde5 62%,#2523a8 100%);box-shadow:0 0 8px #2af16d77}.sphere.active .scene,.sphere:hover .scene{animation:slowturn 10s linear infinite}.helix .scene{transform:rotateX(8deg) rotateY(var(--ry,-8deg))}.coil{position:absolute;left:50%;top:50%;width:330px;height:180px;transform:translate(-50%,-50%) rotateZ(-8deg);border:6px solid transparent;border-top-color:#ff5fd8;border-bottom-color:#36f2a0;border-radius:50%;box-shadow:0 0 20px #ff4ed744}.node{position:absolute;width:16px;height:16px;border-radius:4px;background:linear-gradient(145deg,#ffb32c,#b83fff);border:1px solid #fff5;box-shadow:0 0 9px #ff55dc88;transform:translate(-50%,-50%)}.grid .scene{transform:rotateX(54deg) rotateZ(-8deg) rotateY(var(--ry,-8deg));}.gridplane{position:absolute;left:50%;top:50%;width:320px;height:210px;transform:translate(-50%,-50%) translateZ(-20px);border:1px solid #35eaff66;background:linear-gradient(#0aeaff0b 1px,transparent 1px),linear-gradient(90deg,#0aeaff0b 1px,transparent 1px);background-size:32px 30px;box-shadow:0 0 30px #18dfff13}.grid .tile{width:27px;height:22px}.particle .scene{transform:rotateX(var(--rx,10deg)) rotateY(var(--ry,-8deg))}.particle-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c);transform:translate(-50%,-50%)}.particle .focus{border-color:#ffd21f}.wave .scene{transform:rotateX(18deg) rotateY(var(--ry,-8deg))}.wave-line{position:absolute;left:50%;top:50%;width:360px;height:80px;transform:translate(-50%,-50%) skewX(-12deg);border-top:3px solid #8d95ff;border-radius:50%;box-shadow:0 -12px 0 #8d95ff55,0 12px 0 #8d95ff22}.wave .tile{width:27px;height:22px}
.card.active.playing .helix .coil{}.card.active.playing .sphere .scene{animation:slowturn 10s linear infinite}.card.active.playing .helix .scene{animation:float 4s ease-in-out infinite}.card.active.playing .particle .scene{animation:drift 3.5s ease-in-out infinite}.card.active.playing .wave .scene{animation:wave 3.8s ease-in-out infinite}.card.active.playing .surface .scene{animation:lift 4.5s ease-in-out infinite}.card.active.playing .grid .scene{animation:gridfloat 4.5s ease-in-out infinite}@keyframes slowturn{to{transform:rotateX(8deg) rotateY(352deg)}}@keyframes float{50%{translate:0 -6px}}@keyframes drift{50%{translate:5px -5px}}@keyframes wave{50%{translate:0 -5px}}@keyframes lift{50%{translate:0 -4px}}@keyframes gridfloat{50%{translate:0 -4px}}
.info-row{display:grid;grid-template-columns:1fr 1.9fr 1fr;gap:12px;margin-top:16px}.box{min-height:150px;padding:19px;border:1px solid #142b35;border-radius:11px;background:#03070c;position:relative;overflow:hidden;box-shadow:inset 0 0 18px #000}.box h3{margin:0 0 12px;color:#4ceeff;font-size:17px}.box.support h3{color:#df8aff}.box ul{margin:0;padding-left:18px;line-height:1.9;font-size:13px;color:#d8e3e7}.atom{position:absolute;right:16px;bottom:10px;width:92px;height:66px;border:2px solid #36efff;border-radius:50%;transform:rotate(-18deg);opacity:.7;filter:drop-shadow(0 0 7px #36efff)}.atom:before,.atom:after{content:"";position:absolute;inset:14px -2px;border:1px solid #36efff;border-radius:50%;transform:rotate(60deg)}.atom:after{transform:rotate(-60deg)}.modebox{padding:15px}.modebox h3{text-align:center;margin-bottom:12px}.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.mode{min-height:68px;border:1px solid #28343b;border-radius:7px;background:linear-gradient(180deg,#0b1016,#06090d);color:#e8f1f4;cursor:pointer;transition:.2s}.mode span{display:block;font-size:24px;margin-bottom:4px}.mode:hover{border-color:#3a5964;transform:translateY(-1px)}.mode.active{border-color:#21e7ff;color:#70f4ff;box-shadow:0 0 14px #00dfff22,inset 0 0 12px #00dfff0b}.badge{width:min(440px,92%);margin:14px auto 0;border:1px solid #bc55ea;border-radius:15px;padding:11px;text-align:center;background:#5b1b7022;font-size:17px;color:#f0d7ff;box-shadow:0 0 18px #b34ee522}.badge small{display:block;color:#b5c2c8;font-size:11px;margin-top:3px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}.info-row{grid-template-columns:1fr}.modebox{order:-1}}@media(max-width:620px){.page{padding:15px 6px}.cards{grid-template-columns:1fr}.card{height:305px}.modes{grid-template-columns:repeat(3,1fr)}.mode{min-height:64px}.box{min-height:135px}}
</style>
</head>
<body>
<div class="page">
<section class="hero"><h1>3D 元素周期表 · 多种动态效果</h1><p>Interactive 3D Periodic Table · Multiple Dynamic Styles</p></section>
<section class="cards" id="cards"></section>
<section class="info-row">
<div class="box"><h3>实时数据</h3><ul><li>118 种元素</li><li>原子序、类别、周期、族</li><li>轻量 3D 视觉渲染</li><li>六种动态效果</li></ul><div class="atom"></div></div>
<div class="box modebox"><h3>模式选择</h3><div class="modes" id="modes"><button class="mode active" data-mode="surface"><span>◇</span>表面</button><button class="mode" data-mode="sphere"><span>◉</span>球体</button><button class="mode" data-mode="helix"><span>◌</span>螺旋</button><button class="mode" data-mode="grid"><span>⊞</span>网格</button><button class="mode" data-mode="particle"><span>✣</span>粒子</button><button class="mode" data-mode="wave"><span>⌁</span>波浪</button></div></div>
<div class="box support"><h3>技术支持</h3><ul><li>CSS 3D Transform</li><li>SVG / DOM 本地渲染</li><li>GPU 合成优先</li><li>响应式设计</li></ul></div>
</section>
<div class="badge">3DPeriodicTable · Lightweight<small>纯静态视觉 · 无外部依赖 · 低资源交互</small></div>
</div>
<script>
const data=[['surface','表面模式','Surface Mode','Fe','Iron','55.845'],['sphere','球体模式','Sphere Mode','Au','Gold','196.967'],['helix','螺旋模式','Helix Mode','O','Oxygen','15.999'],['grid','网格模式','Grid Mode','C','Carbon','12.011'],['particle','粒子模式','Particle Mode','Ne','Neon','20.180'],['wave','波浪模式','Wave Mode','Si','Silicon','28.085']];
const cardsEl=document.getElementById('cards');
function focus(sym,name,mass){return '<div class="focus"><div><strong>'+sym+'</strong><small>'+name+' · '+mass+'</small></div></div>'}
function surface(){let s='';for(let i=0;i<42;i++){let x=7+(i%10)*9.3,y=18+Math.floor(i/10)*17; s+='<i class="tile" style="left:'+x+'%;top:'+y+'%;transform:translate(-50%,-50%) translateZ('+(i%4*7)+'px) rotateZ(-8deg)">'+(i+1)+'</i>'}return '<div class="scene">'+s+focus('Fe','Iron','55.845')+'</div>'}
function sphere(){let s='';for(let i=0;i<34;i++){let a=i*2.399,r=70+Math.sqrt(i)*14,x=50+Math.cos(a)*r/4.1,y=50+Math.sin(a)*r/2.7,z=Math.sin(a*1.7)*34;s+='<i class="ball" style="left:'+x+'%;top:'+y+'%;transform:translate(-50%,-50%) translateZ('+z+'px);filter:hue-rotate('+(i*11)+'deg)"></i>'}return '<div class="scene"><i class="orb"></i><i class="orb two"></i>'+s+focus('Au','Gold','196.967')+'</div>'}
function helix(){let s='';for(let i=0;i<25;i++){let t=i/24,x=12+t*76,y=50+Math.sin(t*Math.PI*3.4)*25,z=Math.cos(t*Math.PI*3.4)*34;s+='<i class="node" style="left:'+x+'%;top:'+y+'%;transform:translate(-50%,-50%) translateZ('+z+'px)"></i>'}return '<div class="scene"><i class="coil"></i>'+s+focus('O','Oxygen','15.999')+'</div>'}
function grid(){let s='<i class="gridplane"></i>';for(let i=0;i<36;i++){let x=12+(i%9)*9.5,y=24+Math.floor(i/9)*17;s+='<i class="tile" style="left:'+x+'%;top:'+y+'%;transform:translate(-50%,-50%) translateZ('+(Math.floor(i/9)*8)+'px)">'+(i+1)+'</i>'}return '<div class="scene">'+s+focus('C','Carbon','12.011')+'</div>'}
function particle(){let s='';for(let i=0;i<72;i++){let x=8+(i*47)%84,y=12+(i*71)%74,c=['#ff4c2f','#ffcc28','#31cfff','#d55dff'][i%4];s+='<i class="particle-dot" style="left:'+x+'%;top:'+y+'%;--c:'+c+';width:'+(2+i%4)+'px;height:'+(2+i%4)+'px"></i>'}return '<div class="scene">'+s+focus('Ne','Neon','20.180')+'</div>'}
function wave(){let s='<i class="wave-line"></i>';for(let i=0;i<28;i++){let x=7+i*3.2,y=50+Math.sin(i*.55)*18;s+='<i class="tile" style="left:'+x+'%;top:'+y+'%;transform:translate(-50%,-50%) translateZ('+(i%5*8)+'px)"></i>'}return '<div class="scene">'+s+focus('Si','Silicon','28.085')+'</div>'}
const render={surface,sphere,helix,grid,particle,wave};
function activate(mode,animate=true){document.querySelectorAll('.card').forEach(c=>{let on=c.dataset.mode===mode;c.classList.toggle('active',on);c.classList.toggle('playing',on&&animate)});document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
data.forEach(d=>{let a=document.createElement('article');a.className='card '+d[0]+(d[0]==='surface'?' active playing':'');a.dataset.mode=d[0];a.innerHTML='<div class="head"><i class="dot"></i><b>'+d[1]+'</b><small>• '+d[2]+'</small></div><div class="viz">'+render[d[0]]()+'</div><div class="play">▶</div><div class="caption">拖拽旋转 · 滚轮缩放 · 点击交互</div>';a.onclick=()=>activate(d[0],true);a.addEventListener('pointermove',e=>{let r=a.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;a.style.setProperty('--mx',x+'%');a.style.setProperty('--my',y+'%');a.style.setProperty('--rx',(12-(y-50)*.12)+'deg');a.style.setProperty('--ry',((x-50)*.16)+'deg')});a.addEventListener('pointerleave',()=>{a.style.setProperty('--rx','12deg');a.style.setProperty('--ry','-5deg')});cardsEl.appendChild(a)});
document.querySelectorAll('#modes .mode').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.mode,true)));
activate('surface',false);
</script>
</body>
</html>
