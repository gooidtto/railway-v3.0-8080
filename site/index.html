<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010308">
<title>3D 元素周期表 · 多种动态效果</title>
<style>
:root{--text:#f4fbff;--muted:#91a8b0;--cyan:#42efff;--bg:#010308}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}body{overflow-x:hidden;background:radial-gradient(ellipse at 50% 0,#0a1b29 0,#02060b 38%,#000 78%)}button{font:inherit}
.space,.nebula{position:fixed;inset:0;pointer-events:none;overflow:hidden}.space{z-index:-3;background:radial-gradient(circle at 50% 42%,#0a1824 0,transparent 48%),linear-gradient(#02050a,#000)}.space:before{content:"";position:absolute;inset:-15%;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#65eaff 0 1px,transparent 1.5px),radial-gradient(circle,#d990ff 0 1px,transparent 1.5px);background-size:101px 107px,173px 151px,257px 223px;background-position:13px 29px,47px 11px,91px 73px;opacity:.32;animation:stars 100s linear infinite}.space:after{content:"";position:absolute;width:65vw;height:65vw;left:50%;top:46%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#24eaff13 0,transparent 62%);filter:blur(12px)}.nebula{z-index:-2;background:radial-gradient(ellipse at 12% 31%,#3a75ff0a 0,transparent 27%),radial-gradient(ellipse at 87% 23%,#ef54dc08 0,transparent 29%),radial-gradient(ellipse at 55% 86%,#1eeaff08 0,transparent 31%);filter:blur(22px);animation:nebula 42s ease-in-out infinite alternate}@keyframes stars{to{transform:translate3d(-35px,24px,0)}}@keyframes nebula{to{transform:translate3d(15px,-10px,0) scale(1.025)}}
.page{width:min(1440px,100%);margin:auto;padding:18px 8px 28px}.hero{text-align:center;padding:0 12px 15px}.hero h1{margin:0;font-size:clamp(36px,4.6vw,68px);line-height:1.04;font-weight:850;background:linear-gradient(90deg,#38f2ff,#a0e6ff 32%,#c99cff 68%,#ff79dc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #36eaff22}.hero p{margin:9px 0 0;color:#79b5c1;font-size:clamp(13px,1.45vw,19px)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.card{--accent:#42efff;position:relative;height:355px;overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 38%,#15252c);border-radius:11px;background:linear-gradient(145deg,#061019e8,#010306ef 68%,#02070ce8);box-shadow:inset 0 0 45px #000,0 0 0 1px #ffffff08;cursor:pointer;isolation:isolate;transition:border-color .22s,box-shadow .22s,transform .22s}.card:hover,.card.active{border-color:color-mix(in srgb,var(--accent) 80%,#fff);box-shadow:inset 0 0 45px #000,0 0 28px color-mix(in srgb,var(--accent) 13%,transparent)}.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 17%,transparent),transparent 36%);opacity:0;transition:opacity .2s;pointer-events:none}.card:hover:before,.card.active:before{opacity:1}.surface{--accent:#c978ff}.sphere{--accent:#2af26e}.helix{--accent:#ff67d9}.grid{--accent:#28eaff}.particle{--accent:#ffd21f}.wave{--accent:#8c91ff}
.head{position:absolute;left:18px;top:16px;z-index:8}.head b{font-size:19px}.head small{display:block;margin-top:5px;color:#afbdc2;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--accent);box-shadow:0 0 15px var(--accent)}.caption{position:absolute;right:17px;bottom:17px;color:#c1cbd0;font-size:12px;z-index:8}.play{position:absolute;left:18px;bottom:13px;width:36px;height:36px;border:1px solid #4a626b;border-radius:50%;display:grid;place-items:center;color:#fff;background:#02070ddd;z-index:9}.card.active .play{border-color:var(--accent);box-shadow:0 0 17px color-mix(in srgb,var(--accent) 28%,transparent)}
.scene{position:absolute;inset:53px 4px 43px;perspective:760px;perspective-origin:50% 48%;transform-style:preserve-3d}.stage{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .28s cubic-bezier(.2,.7,.2,1)}.card:hover .stage{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.018)}
.el{position:absolute;width:27px;height:27px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:8px;font-weight:750;transform-style:preserve-3d;transform:translate3d(var(--x),var(--y),var(--z));background:linear-gradient(145deg,#ffffff32,#05090e 56%,#000);border:1px solid color-mix(in srgb,var(--c) 72%,#fff);box-shadow:inset 0 0 8px color-mix(in srgb,var(--c) 18%,transparent),0 0 8px color-mix(in srgb,var(--c) 18%,transparent);text-shadow:0 0 6px var(--c);will-change:transform}.el:before{content:"";position:absolute;inset:2px;border:1px solid #fff2;border-radius:4px;transform:translateZ(5px)}.el.heroel{width:31px;height:31px;font-size:9px;box-shadow:inset 0 0 12px color-mix(in srgb,var(--c) 26%,transparent),0 0 17px color-mix(in srgb,var(--c) 31%,transparent)}
.depth{position:absolute;left:50%;top:50%;width:190px;height:190px;border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:50%;transform:translate(-50%,-50%) rotateX(66deg) translateZ(-20px);box-shadow:0 0 25px color-mix(in srgb,var(--accent) 8%,transparent)}.depth:before,.depth:after{content:"";position:absolute;inset:22px;border:1px solid color-mix(in srgb,var(--accent) 14%,transparent);border-radius:50%}.depth:after{inset:50px}.floor{position:absolute;left:4%;right:4%;bottom:2%;height:58%;transform:rotateX(68deg) translateZ(-50px);transform-origin:bottom;background:repeating-linear-gradient(90deg,transparent 0 25px,color-mix(in srgb,var(--accent) 11%,transparent) 26px 27px),repeating-linear-gradient(0deg,transparent 0 20px,color-mix(in srgb,var(--accent) 10%,transparent) 21px 22px);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);opacity:.72}
.info{position:absolute;left:50%;top:48%;width:91px;height:78px;transform:translate(-50%,-50%) translateZ(125px);border:1px solid #42efff77;border-radius:9px;background:linear-gradient(145deg,#061720ef,#02070cf0);box-shadow:0 0 25px #23eaff1d,inset 0 0 18px #2aeaff0d;display:grid;place-items:center;text-align:center;z-index:6}.info strong{font-size:29px;line-height:1}.info sup{font-size:10px;margin-left:2px}.info span{font-size:11px}.info em{font-size:10px;color:#9fb2b8;font-style:normal}
.orbit{position:absolute;left:50%;top:48%;border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:50%;transform:translate(-50%,-50%) rotateX(64deg);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 7%,transparent)}.o1{width:205px;height:86px}.o2{width:280px;height:120px}.o3{width:350px;height:150px}
.wave-line{position:absolute;left:5%;right:5%;height:72px;border:2px solid color-mix(in srgb,var(--accent) 58%,transparent);border-color:color-mix(in srgb,var(--accent) 58%,transparent) transparent transparent;border-radius:50%;transform:rotateX(58deg);opacity:.7}.wave-line:nth-child(1){top:31%}.wave-line:nth-child(2){top:44%;transform:rotateX(58deg) rotateZ(3deg) scale(1.05)}.wave-line:nth-child(3){top:57%;transform:rotateX(58deg) rotateZ(-3deg) scale(1.1)}
.particle-dot{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--pc);box-shadow:0 0 7px var(--pc);transform:translateZ(var(--pz));opacity:.85}.card.active .particle-dot{animation:float 4.5s ease-in-out infinite}.particle-dot:nth-child(3n){animation-delay:-1.3s}.particle-dot:nth-child(4n){animation-delay:-2.1s}@keyframes float{50%{transform:translate3d(0,-8px,20px) scale(1.35)}}
.surface .stage{transform:rotateX(48deg) rotateZ(-5deg) translateY(24px)}.sphere .stage{transform:rotateX(18deg)}.helix .stage{transform:rotateX(20deg) rotateZ(-3deg)}.grid .stage{transform:rotateX(54deg) rotateZ(-2deg) translateY(17px)}.particle .stage{transform:rotateX(38deg)}.wave .stage{transform:rotateX(48deg)}
.controls-title{display:flex;align-items:center;justify-content:center;gap:24px;margin:15px auto 7px;font-size:20px;font-weight:700}.controls-title:before,.controls-title:after{content:"";height:1px;flex:1;max-width:240px;background:linear-gradient(90deg,transparent,#2b7683)}.controls-title:after{background:linear-gradient(90deg,#2b7683,transparent)}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;width:min(760px,94%);margin:0 auto 15px}.control{display:flex;align-items:center;justify-content:center;gap:8px;color:#8fd8e4;font-size:13px}.control .ico{width:34px;height:34px;border:1px solid #7edce7;border-radius:50%;display:grid;place-items:center;color:#9bf5ff;font-size:18px}.control span span{display:block;color:#829198;font-size:11px;margin-top:2px}
.info-row{display:grid;grid-template-columns:1fr 1.9fr 1fr;gap:12px}.box{min-height:150px;border:1px solid #17343e;border-radius:11px;background:linear-gradient(145deg,#040a10eb,#02050aed);padding:18px 20px;position:relative;overflow:hidden}.box h3{margin:0 0 10px;color:#4eeeff;font-size:17px}.box.support h3{color:#df8aff}.box ul{margin:0;padding-left:17px;line-height:1.85;font-size:13px;color:#dbe6e9}.atom{position:absolute;right:18px;bottom:10px;width:96px;height:68px;border:2px solid #34edff;border-radius:50%;transform:rotate(-18deg);opacity:.82;box-shadow:0 0 12px #28eaff33}.atom:before,.atom:after{content:"";position:absolute;inset:13px -2px;border:1px solid #34edff;border-radius:50%;transform:rotate(60deg)}.atom:after{transform:rotate(-60deg)}.atom i{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:#d58aff;box-shadow:0 0 12px #d58aff;transform:translate(-50%,-50%)}.modebox{padding:15px}.modebox h3{text-align:center;margin-bottom:12px}.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.mode{min-height:70px;border:1px solid #29343a;border-radius:7px;background:#080d12;color:#e9f3f6;cursor:pointer;transition:.2s}.mode .micon{display:block;height:28px;font-size:23px;line-height:28px;margin-bottom:3px;color:#d6e7ec}.mode.active,.mode:hover{border-color:#21e7ff;color:#70f4ff;box-shadow:0 0 18px #00dfff22,inset 0 0 14px #00dfff0b}.mode.active .micon{color:#6ff5ff}.support-hex{position:absolute;right:24px;bottom:18px;width:82px;height:82px;border:2px solid #35efff;transform:rotate(30deg) skewX(-8deg);box-shadow:0 0 15px #35efff18}.support-hex:before,.support-hex:after{content:"";position:absolute;inset:10px;border:1px solid #35efff}.support-hex:after{transform:rotate(60deg)}
@media(max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}.info-row{grid-template-columns:1fr}.modebox{order:-1}.controls{gap:15px}.modes{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.page{padding:14px 5px 22px}.cards{grid-template-columns:1fr}.card{height:300px}.controls{grid-template-columns:repeat(2,1fr);gap:12px}.controls-title{font-size:18px}.modes{grid-template-columns:repeat(3,1fr)}.mode{min-height:64px}.hero h1{font-size:34px}.hero p{font-size:12px}.el{width:22px;height:22px;font-size:7px}.info{width:82px;height:70px}.info strong{font-size:25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="space" aria-hidden="true"></div><div class="nebula" aria-hidden="true"></div>
<div class="page">
<section class="hero"><h1>3D 元素周期表 · 多种动态效果</h1><p>Interactive 3D Periodic Table · Multiple Dynamic Styles</p></section>
<section class="cards" id="cards"></section>
<div class="controls-title">交互控制</div>
<div class="controls"><div class="control"><div class="ico">⟳</div><div>拖拽旋转<span>Rotate</span></div></div><div class="control"><div class="ico">⌕</div><div>滚轮缩放<span>Zoom</span></div></div><div class="control"><div class="ico">☝</div><div>悬停查看<span>Hover</span></div></div><div class="control"><div class="ico">▷</div><div>自动旋转<span>Auto Rotate</span></div></div></div>
<section class="info-row"><div class="box"><h3>实时数据</h3><ul><li>118 种元素</li><li>原子量、类别、周期、族</li><li>3D 动态渲染</li><li>多种视觉效果</li></ul><div class="atom"><i></i></div></div><div class="box modebox"><h3>模式选择</h3><div class="modes" id="modes"><button class="mode active" data-mode="surface"><span class="micon">◇</span>表面</button><button class="mode" data-mode="sphere"><span class="micon">◉</span>球体</button><button class="mode" data-mode="helix"><span class="micon">◌</span>螺旋</button><button class="mode" data-mode="grid"><span class="micon">⊞</span>网格</button><button class="mode" data-mode="particle"><span class="micon">✣</span>粒子</button><button class="mode" data-mode="wave"><span class="micon">⌁</span>波浪</button></div></div><div class="box support"><h3>技术支持</h3><ul><li>轻量 3D CSS</li><li>GPU 合成</li><li>响应式设计</li><li>移动端支持</li></ul><div class="support-hex"></div></div></section>
</div>
<script>
const modes=[['surface','表面模式','Surface Mode','Fe','Iron','55.845'],['sphere','球体模式','Sphere Mode','Au','Gold','196.967'],['helix','螺旋模式','Helix Mode','O','Oxygen','15.999'],['grid','网格模式','Grid Mode','C','Carbon','12.011'],['particle','粒子模式','Particle Mode','Ne','Neon','20.180'],['wave','波浪模式','Wave Mode','Si','Silicon','28.085']];
const palette={surface:['#20eaff','#c878ff','#ff9d20','#21e77b'],sphere:['#39f27b','#8bffbe','#21eaff','#b168ff'],helix:['#ff67d9','#ff9a2f','#a95cff','#27e88a'],grid:['#22eaff','#31eaff','#5e7dff','#bd4cff'],particle:['#ffd21f','#ff4d35','#20e8ff','#c64cff'],wave:['#8c91ff','#20dfff','#22e96c','#ffb51d']};
const syms=['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Ge','As','Se','Br','Kr'];
function info(m,i){return `<div class="info"><strong>${m[3]}<sup>${i}</sup></strong><span>${m[4]}</span><em>${m[5]}</em></div>`}
function nodes(type){let s='',p=palette[type];const count=type==='particle'?42:30;for(let i=0;i<count;i++){let x,y,z;if(type==='sphere'){const phi=Math.acos(1-2*(i+.5)/count),theta=Math.PI*(3-Math.sqrt(5))*i;x=Math.sin(phi)*Math.cos(theta)*135;y=Math.cos(phi)*105;z=Math.sin(phi)*Math.sin(theta)*135}else if(type==='helix'){const a=i*.82;x=Math.cos(a)*92;y=-92+i*6.2;z=Math.sin(a)*92}else if(type==='grid'){x=((i%5)-2)*48;y=(Math.floor(i/5)%3-1)*45;z=(Math.floor(i/15)-.5)*70}else if(type==='wave'){x=((i%10)-4.5)*38;z=(Math.floor(i/10)-1.5)*42;y=Math.sin(i*.75)*28}else{ x=((i%10)-4.5)*36;y=(Math.floor(i/10)-1)*34;z=(i%5-2)*12 }
const c=p[i%p.length],hero=i%17===0; s+=`<div class="el ${hero?'heroel':''}" style="--x:calc(50% + ${x}px);--y:calc(50% + ${y}px);--z:${z}px;--c:${c}">${syms[i%syms.length]}</div>`}return s}
function make(m,i){let extra='';if(m[0]==='grid')extra='<div class="floor"></div>';if(m[0]==='sphere')extra='<div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div>';if(m[0]==='wave')extra='<div class="wave-line"></div><div class="wave-line"></div><div class="wave-line"></div>';if(m[0]==='particle')for(let j=0;j<24;j++)extra+=`<i class="particle-dot" style="left:${5+(j*29)%90}%;top:${8+(j*37)%80}%;--pc:${palette.particle[j%4]};--pz:${(j%7-3)*18}px"></i>`;return `<article class="card ${m[0]} ${i===0?'active':''}" data-mode="${m[0]}"><div class="head"><b><span class="dot"></span>${m[1]}</b><small>• ${m[2]}</small></div><div class="scene"><div class="stage"><div class="depth"></div>${nodes(m[0])}${extra}${info(m,i+1)}</div></div><div class="play">▷</div><div class="caption">${['拖拽旋转 · 滚轮缩放 · 点击元素','均匀球面 · 空间深度 · 点击高亮','圆柱螺旋 · Z 轴纵深 · 点击查看','透视网格 · 三维层次 · 拖拽交互','粒子流动 · 低频动画 · 点击聚焦','波浪曲面 · 三维起伏 · 点击查看'][i]}</div></article>`}
document.getElementById('cards').innerHTML=modes.map(make).join('');
const cards=[...document.querySelectorAll('.card')];function activate(mode){cards.forEach(c=>c.classList.toggle('active',c.dataset.mode===mode));document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}cards.forEach(card=>{card.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect();card.style.setProperty('--mx',`${e.clientX-r.left}px`);card.style.setProperty('--my',`${e.clientY-r.top}px`);card.style.setProperty('--rx',`${((e.clientY-r.top)/r.height-.5)*-5}deg`);card.style.setProperty('--ry',`${((e.clientX-r.left)/r.width-.5)*7}deg`)});card.addEventListener('mouseleave',()=>{card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg')});card.addEventListener('click',()=>activate(card.dataset.mode))});document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.mode)));
</script>
</body>
</html>
