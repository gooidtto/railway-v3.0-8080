<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#010308">
<title>3D 元素周期表 · 多种动态效果</title>
<style>
:root{--text:#f5fbff;--cyan:#42efff}*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}body{overflow-x:hidden;background:#000}button{font:inherit}
.space,.nebula{position:fixed;inset:0;pointer-events:none;overflow:hidden}.space{z-index:-2;background:radial-gradient(ellipse at 50% 35%,#0a1a2a 0,#03070d 38%,#000 76%)}.space:before{content:"";position:absolute;inset:-15%;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#63eaff 0 1px,transparent 1.5px),radial-gradient(circle,#d98cff 0 1px,transparent 1.5px);background-size:101px 107px,173px 151px,257px 229px;background-position:13px 29px,47px 11px,91px 73px;opacity:.38;animation:stars 90s linear infinite}.space:after{content:"";position:absolute;width:70vw;height:70vw;left:50%;top:45%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#20dcff16 0,transparent 62%);filter:blur(15px)}.nebula{z-index:-1;background:radial-gradient(ellipse at 16% 30%,#306bff0b 0,transparent 28%),radial-gradient(ellipse at 84% 23%,#ff3ad80a 0,transparent 29%),radial-gradient(ellipse at 50% 82%,#2cf5ff08 0,transparent 30%);filter:blur(26px);animation:nebula 36s ease-in-out infinite alternate}@keyframes stars{to{transform:translate3d(-35px,24px,0)}}@keyframes nebula{to{transform:translate3d(16px,-12px,0) scale(1.025)}}
.page{width:min(1440px,100%);margin:auto;padding:18px 8px 28px}.hero{text-align:center;padding:0 12px 15px}.hero h1{margin:0;font-size:clamp(36px,4.6vw,68px);line-height:1.04;font-weight:850;letter-spacing:.01em;background:linear-gradient(90deg,#38f2ff,#a0e6ff 32%,#c99cff 68%,#ff79dc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #36eaff20}.hero p{margin:9px 0 0;color:#79b5c1;font-size:clamp(13px,1.45vw,19px);letter-spacing:.035em}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{--accent:#5aeaff;position:relative;height:355px;overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 35%,#182a32);border-radius:11px;background:linear-gradient(145deg,#050b11d9,#010306e8 64%,#02070bdd);box-shadow:inset 0 0 40px #000,0 0 0 1px #fff1;cursor:pointer;isolation:isolate;transition:.25s}.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 17%,transparent),transparent 38%);opacity:0;transition:.25s}.card:hover:before,.card.active:before{opacity:1}.card:hover,.card.active{border-color:color-mix(in srgb,var(--accent) 76%,#15343e);box-shadow:inset 0 0 40px #000,0 0 26px color-mix(in srgb,var(--accent) 12%,transparent)}
.head{position:absolute;left:18px;top:16px;z-index:8}.head b{font-size:19px;font-weight:750}.head small{display:block;margin-top:5px;color:#afbdc2;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--accent);box-shadow:0 0 15px var(--accent)}.caption{position:absolute;right:17px;bottom:17px;color:#c1cbd0;font-size:12px;z-index:8}.play{position:absolute;left:18px;bottom:13px;width:36px;height:36px;border:1px solid #4a626b;border-radius:50%;display:grid;place-items:center;color:#fff;background:#02070dcc;z-index:9;font-size:15px}.card:hover .play{border-color:var(--accent);box-shadow:0 0 17px color-mix(in srgb,var(--accent) 28%,transparent)}
.surface{--accent:#c97bff}.sphere{--accent:#2af26e}.helix{--accent:#ff67d9}.grid{--accent:#28eaff}.particle{--accent:#ffd21f}.wave{--accent:#8c91ff}
.scene{position:absolute;inset:54px 4px 42px;perspective:850px;perspective-origin:50% 50%;transform-style:preserve-3d}.stage{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s}.card:hover .stage{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.015)}.surface .stage{transform:rotateX(48deg) rotateZ(-5deg) translateY(25px)}.sphere .stage{transform:rotateX(22deg)}.helix .stage{transform:rotateX(18deg) rotateZ(-3deg)}.grid .stage{transform:rotateX(52deg) rotateZ(-2deg) translateY(18px)}.particle .stage{transform:rotateX(38deg)}.wave .stage{transform:rotateX(48deg)}
.el{position:absolute;width:27px;height:27px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:8px;font-weight:700;transform-style:preserve-3d;background:linear-gradient(145deg,#ffffff2b,#05090e 58%);border:1px solid color-mix(in srgb,var(--c) 72%,#fff);box-shadow:inset 0 0 8px color-mix(in srgb,var(--c) 18%,transparent),0 0 7px color-mix(in srgb,var(--c) 16%,transparent);text-shadow:0 0 5px color-mix(in srgb,var(--c) 70%,#fff)}.el:after{content:"";position:absolute;inset:3px;border:1px solid #fff2;border-radius:3px;transform:translateZ(4px)}.heroel{width:30px;height:30px;font-size:9px}.info{position:absolute;left:50%;top:47%;width:91px;height:78px;transform:translate(-50%,-50%) translateZ(120px);border:1px solid #42efff77;border-radius:8px;background:linear-gradient(145deg,#06131bdf,#02070ce8);box-shadow:0 0 22px #23eaff19,inset 0 0 18px #2aeaff0d;display:grid;place-items:center;text-align:center;z-index:6}.info strong{font-size:29px;line-height:1}.info strong sup{font-size:11px}.info span{font-size:11px;color:#dce8eb}.info em{font-size:10px;color:#9fb2b8;font-style:normal}
.surface .el{--c:#22eaff}.sphere .el{--c:#4eff9a}.helix .el{--c:#ff67d9}.grid .el{--c:#31eaff}.particle .el{--c:#ffd21f}.wave .el{--c:#8d91ff}.floor{position:absolute;left:4%;right:4%;bottom:4%;height:55%;transform:rotateX(68deg) translateZ(-35px);transform-origin:bottom;border:1px solid #28eaff44;background:repeating-linear-gradient(90deg,transparent 0 27px,#28eaff18 28px 29px),repeating-linear-gradient(0deg,transparent 0 21px,#28eaff18 22px 23px);opacity:.75}.orbit{position:absolute;left:50%;top:48%;border:1px solid #ffffff22;border-radius:50%;transform:translate(-50%,-50%) rotateX(64deg)}.o1{width:210px;height:92px}.o2{width:280px;height:124px}.o3{width:350px;height:155px}.helix .orbit{border-color:#ff67d933}.particle-dot{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--pc);box-shadow:0 0 8px var(--pc);animation:float 4s ease-in-out infinite}.particle-dot:nth-child(3n){animation-delay:-1.5s}.particle-dot:nth-child(4n){animation-delay:-2.5s}@keyframes float{50%{transform:translateY(-9px) scale(1.35)}}.wave-line{position:absolute;left:4%;right:4%;height:72px;border:2px solid #8d91ff99;border-color:#8d91ff99 transparent transparent;border-radius:50%;transform:rotateX(58deg) rotateZ(-4deg);opacity:.75}.wave-line:nth-child(1){top:31%}.wave-line:nth-child(2){top:43%;transform:rotateX(58deg) rotateZ(3deg) scale(1.05)}.wave-line:nth-child(3){top:55%;transform:rotateX(58deg) rotateZ(-2deg) scale(1.1)}
.controls-title{display:flex;align-items:center;justify-content:center;gap:24px;margin:15px auto 7px;font-size:20px;font-weight:700}.controls-title:before,.controls-title:after{content:"";height:1px;flex:1;max-width:240px;background:linear-gradient(90deg,transparent,#2b7683)}.controls-title:after{background:linear-gradient(90deg,#2b7683,transparent)}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;width:min(760px,94%);margin:0 auto 15px}.control{display:flex;align-items:center;justify-content:center;gap:8px;color:#8fd8e4;font-size:13px}.ico{width:34px;height:34px;border:1px solid #7edce7;border-radius:50%;display:grid;place-items:center;color:#9bf5ff;font-size:18px}.control span span{display:block;color:#829198;font-size:11px;margin-top:2px}
.info-row{display:grid;grid-template-columns:1fr 1.9fr 1fr;gap:12px}.box{min-height:150px;border:1px solid #17343e;border-radius:11px;background:linear-gradient(145deg,#040a10e8,#02050ae8);padding:18px 20px;position:relative;overflow:hidden}.box:after{content:"";position:absolute;inset:auto 0 0;height:1px;background:linear-gradient(90deg,transparent,#25eaff,transparent);opacity:.35}.box h3{margin:0 0 10px;color:#4eeeff;font-size:17px}.support h3{color:#df8aff}.box ul{margin:0;padding-left:17px;line-height:1.85;font-size:13px;color:#dbe6e9}.atom{position:absolute;right:18px;bottom:10px;width:96px;height:68px;border:2px solid #34edff;border-radius:50%;transform:rotate(-18deg);opacity:.82}.atom:before,.atom:after{content:"";position:absolute;inset:13px -2px;border:1px solid #34edff;border-radius:50%;transform:rotate(60deg)}.atom:after{transform:rotate(-60deg)}.atom i{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:#d58aff;box-shadow:0 0 12px #d58aff;transform:translate(-50%,-50%)}.modebox{padding:15px}.modebox h3{text-align:center;margin-bottom:12px}.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.mode{min-height:70px;border:1px solid #29343a;border-radius:7px;background:#080d12;color:#e9f3f6;cursor:pointer;transition:.2s}.micon{display:block;height:28px;font-size:23px;line-height:28px;margin-bottom:3px;color:#d6e7ec}.mode.active,.mode:hover{border-color:#21e7ff;color:#70f4ff;box-shadow:0 0 18px #00dfff22,inset 0 0 14px #00dfff0b}.support-hex{position:absolute;right:24px;bottom:18px;width:82px;height:82px;border:2px solid #35efff;transform:rotate(30deg) skewX(-8deg);box-shadow:0 0 15px #35efff18}.support-hex:before,.support-hex:after{content:"";position:absolute;inset:10px;border:1px solid #35efff}.support-hex:after{transform:rotate(60deg)}
@media(max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}.info-row{grid-template-columns:1fr}.modebox{order:-1}.controls{gap:15px}.modes{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.page{padding:14px 5px 22px}.cards{grid-template-columns:1fr}.card{height:300px}.controls{grid-template-columns:repeat(2,1fr);gap:12px}.controls-title{font-size:18px}.modes{grid-template-columns:repeat(3,1fr)}.mode{min-height:64px}.hero h1{font-size:34px}.hero p{font-size:12px}.caption{font-size:10px;right:13px}.el{width:22px;height:22px;font-size:7px}.info{width:82px;height:70px}.info strong{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="space" aria-hidden="true"></div><div class="nebula" aria-hidden="true"></div>
<div class="page"><section class="hero"><h1>3D 元素周期表 · 多种动态效果</h1><p>Interactive 3D Periodic Table · Multiple Dynamic Styles</p></section><section class="cards" id="cards"></section><div class="controls-title">交互控制</div><div class="controls"><div class="control"><div class="ico">⟳</div><div>拖拽旋转<span>Rotate</span></div></div><div class="control"><div class="ico">⌕</div><div>滚轮缩放<span>Zoom</span></div></div><div class="control"><div class="ico">☝</div><div>悬停查看<span>Hover</span></div></div><div class="control"><div class="ico">▷</div><div>自动旋转<span>Auto Rotate</span></div></div></div><section class="info-row"><div class="box"><h3>实时数据</h3><ul><li>118 种元素</li><li>原子量、类别、周期、族</li><li>3D 动态渲染</li><li>多种视觉效果</li></ul><div class="atom"><i></i></div></div><div class="box modebox"><h3>模式选择</h3><div class="modes" id="modes"><button class="mode active" data-mode="surface"><span class="micon">◇</span>表面</button><button class="mode" data-mode="sphere"><span class="micon">◉</span>球体</button><button class="mode" data-mode="helix"><span class="micon">◌</span>螺旋</button><button class="mode" data-mode="grid"><span class="micon">⊞</span>网格</button><button class="mode" data-mode="particle"><span class="micon">✣</span>粒子</button><button class="mode" data-mode="wave"><span class="micon">⌁</span>波浪</button></div></div><div class="box support"><h3>技术支持</h3><ul><li>轻量 3D CSS</li><li>GPU 合成</li><li>响应式设计</li><li>移动端支持</li></ul><div class="support-hex"></div></div></section></div>
<script>
const modes=[['surface','表面模式','Surface Mode','Fe','Iron','55.845',26],['sphere','球体模式','Sphere Mode','Au','Gold','196.967',79],['helix','螺旋模式','Helix Mode','O','Oxygen','15.999',8],['grid','网格模式','Grid Mode','C','Carbon','12.011',6],['particle','粒子模式','Particle Mode','Ne','Neon','20.180',10],['wave','波浪模式','Wave Mode','Si','Silicon','28.085',14]];
const colors={surface:['#ff9d20','#21e77b','#16e7ff','#8d63ff'],sphere:['#ffb219','#a4ee1d','#24e9ff','#9e5dff'],helix:['#ff781b','#ff3f59','#b64cff','#27e88a'],grid:['#19eaff','#22e87a','#6f5cff','#bd4cff'],particle:['#ff4029','#ffd51e','#20e8ff','#c64cff'],wave:['#ffb51d','#22e96c','#1ccfff','#9458ff']};
function info(m){return `<div class="info"><strong>${m[3]}<sup>${m[6]}</sup></strong><span>${m[4]}</span><em>${m[5]}</em></div>`}function elements(type){let s='';for(let i=0;i<72;i++){const x=5+(i%12)*8.1,y=15+Math.floor(i/12)*12;s+=`<div class="el ${i%13===0?'heroel':''}" style="left:${x}%;top:${y}%;--c:${colors[type][i%colors[type].length]}">${['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg'][i%12]}</div>`}return s}function scene(m){let x='';if(m[0]==='grid')x+='<div class="floor"></div>';if(m[0]==='sphere')x+='<div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div>';if(m[0]==='particle')for(let i=0;i<34;i++)x+=`<i class="particle-dot" style="left:${4+(i*17)%91}%;top:${8+(i*29)%82}%;--pc:${colors.particle[i%4]}"></i>`;if(m[0]==='wave')x+='<div class="wave-line"></div><div class="wave-line"></div><div class="wave-line"></div>';return `<div class="scene"><div class="stage">${elements(m[0])}${x}${info(m)}</div></div>`}function build(){document.getElementById('cards').innerHTML=modes.map((m,i)=>`<article class="card ${m[0]} ${i===0?'active':''}" data-mode="${m[0]}"><div class="head"><b><span class="dot"></span>${m[1]}</b><small>• ${m[2]}</small></div>${scene(m)}<div class="play">▷</div><div class="caption">${['拖拽旋转 · 滚轮缩放 · 点击元素','自动旋转中 · 悬停查看 · 点击高亮','动态螺旋 · 自动旋转 · 点击查看','网格排列 · 拖拽旋转 · 点击交互','粒子流动 · 动态呼吸 · 点击聚焦','波浪动画 · 自动旋转 · 点击查看'][i]}</div></article>`).join('')}build();const cards=[...document.querySelectorAll('.card')];function activate(mode){cards.forEach(c=>c.classList.toggle('active',c.dataset.mode===mode));document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}cards.forEach(c=>{c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',`${e.clientX-r.left}px`);c.style.setProperty('--my',`${e.clientY-r.top}px`);c.style.setProperty('--rx',`${((e.clientY-r.top)/r.height-.5)*-5}deg`);c.style.setProperty('--ry',`${((e.clientX-r.left)/r.width-.5)*7}deg`)});c.addEventListener('mouseleave',()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')});c.addEventListener('click',()=>activate(c.dataset.mode))});document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.mode)));
</script></body></html>
